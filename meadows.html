
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meadows Supply Drops</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: #f4e8c8;
}

.banner {
  width: 100%;
  padding: 8px;
  background: rgba(20, 41, 27, 0.90);
  border: 1px solid #b99a55;
  border-radius: 9px;
}

.heading {
  text-align: center;
  color: #f1cd7b;
  font-weight: 900;
  font-size: 17px;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.subtitle {
  text-align: center;
  color: #b7d6a5;
  font-size: 11px;
  margin-bottom: 8px;
}

.items {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.item {
  min-width: 0;
  min-height: 70px;
  text-align: center;
  background: rgba(48, 76, 50, 0.85);
  border: 1px solid #718c58;
  border-radius: 7px;
  padding: 8px 5px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.gift {
  font-size: 15px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.resource {
  color: #c8e8a8;
  font-size: 12px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

.thankyou {
  background: rgba(70, 80, 43, 0.85);
  border-color: #d4b76a;
}

.thankyou .gift {
  color: #f1cd7b;
}

.thankyou .resource {
  color: #f4e8c8;
}
</style>
</head>

<body>
<div class="banner">
  <div class="heading">🌿 MEADOWS SUPPLY DROPS 🌿</div>
  <div class="subtitle">OFFERINGS TO THE VIKING</div>
  <div class="items" id="items"></div>
</div>

<script>
const supplies = [
  { gift: "🌹 Rosa", resource: "🪵 1 Wood" },
  { gift: "🥊 Gold Boxing Gloves", resource: "🪨 1 Stone" },
  { gift: "🐬 Dolphin", resource: "🪨 1 Flint" },
  { gift: "🧸 Hi Bear", resource: "🦌 1 Deer Hide" },
  { gift: "🎉 Bravo!", resource: "🐗 1 Leather Scrap" },
  { gift: "🍅 Tiny Blush", resource: "🟡 1 Resin" },
  { gift: "✉️ Lyric Mail", resource: "🪶 1 Feather" },
  {
    gift: "❤️ THANK YOU!",
    resource: "Thanks for watching, chatting & supporting the Viking! ⚔️",
    thankyou: true
  }
];

const container = document.getElementById("items");

const cardsPerPage = 2;
const rotationInterval = 4000;
let currentPage = 0;

const totalPages = Math.ceil(supplies.length / cardsPerPage);

function renderPage() {
  container.replaceChildren();

  const start = currentPage * cardsPerPage;
  const visible = supplies.slice(start, start + cardsPerPage);

  visible.forEach(item => {
    const card = document.createElement("div");
    card.className = item.thankyou ? "item thankyou" : "item";

    const gift = document.createElement("div");
    gift.className = "gift";
    gift.textContent = item.gift;

    const resource = document.createElement("div");
    resource.className = "resource";
    resource.textContent = item.resource;

    card.append(gift, resource);
    container.appendChild(card);
  });
}

renderPage();

setInterval(() => {
  currentPage = (currentPage + 1) % totalPages;
  renderPage();
}, rotationInterval);
</script>
</body>
</html>
