
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joose Viking Chaos | Blessings of Odin</title>

<style>
  :root {
    --gold: #efbc73;
    --cream: #fff1dc;
    --blue: #80d8ff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    display: flex;
    align-items: flex-end;
  }

  .banner {
    width: 100%;
    padding: 10px 14px 12px;
    background: linear-gradient(
      135deg,
      rgba(8, 23, 43, 0.96),
      rgba(13, 49, 79, 0.96)
    );
    border-top: 3px solid var(--gold);
    border-bottom: 3px solid #397da9;
    box-shadow: 0 0 24px rgba(55, 145, 220, 0.4);
  }

  .heading {
    text-align: center;
    color: var(--gold);
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(239, 188, 115, .3);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
  }

  .item {
    min-width: 0;
    padding: 10px 6px;
    text-align: center;
    background: rgba(5, 15, 29, 0.55);
    border: 1px solid rgba(239, 188, 115, 0.45);
    border-radius: 7px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .gift {
    color: var(--gold);
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
  }

  .blessing {
    color: var(--blue);
    font-size: 15px;
    font-weight: bold;
    overflow-wrap: anywhere;
  }

  .effect {
    color: var(--cream);
    font-size: 13px;
    line-height: 1.25;
  }

  @media (max-width: 850px) {
    .banner {
      padding: 8px;
    }

    .heading {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .grid {
      gap: 5px;
    }

    .item {
      padding: 8px 3px;
    }

    .gift {
      font-size: 13px;
    }

    .blessing {
      font-size: 12px;
    }

    .effect {
      font-size: 11px;
    }
  }

  @media (max-width: 450px) {
    .heading {
      font-size: 15px;
      letter-spacing: 1px;
    }

    .gift {
      font-size: 11px;
    }

    .blessing {
      font-size: 10px;
    }

    .effect {
      font-size: 9px;
    }
  }
</style>
</head>

<body>

<div class="banner">

  <div class="heading">
    ⚡ BLESSINGS OF ODIN ⚡
  </div>

  <div class="grid" id="blessingGrid"></div>

</div>

<script>
const blessings = [
  {
    gift: "Paper Crane",
    name: "Odin's Speed",
    effect: "Speed 30s"
  },
  {
    gift: "Confetti",
    name: "Odin's Mercy",
    effect: "+25 HP"
  },
  {
    gift: "Blast Drum",
    name: "Odin's Aegis",
    effect: "Shielding 30s"
  },
  {
    gift: "Forever Rosa",
    name: "Thor's Fury",
    effect: "Berserker 30s"
  },
  {
    gift: "Night Star",
    name: "Odin's Endurance",
    effect: "+25 Stamina"
  },
  {
    gift: "Air Dancer",
    name: "Thor's Stone Skin",
    effect: "Protection 30s"
  },
  {
    gift: "Love You",
    name: "Freya's Blessing",
    effect: "Poison Resist 60s"
  },
  {
    gift: "Meerkat",
    name: "Odin's Rest",
    effect: "Rested 60s"
  },
  {
    gift: "Manifesting",
    name: "Eikthyr's Grace",
    effect: "Reduced Stamina 30s"
  },
  {
    gift: "Groove Guitar",
    name: "Njord's Gift",
    effect: "Swimming Tonic 60s"
  }
];

const grid = document.getElementById("blessingGrid");

blessings.forEach(item => {
  const card = document.createElement("div");
  card.className = "item";

  const gift = document.createElement("div");
  gift.className = "gift";
  gift.textContent = "🎁 " + item.gift;

  const blessing = document.createElement("div");
  blessing.className = "blessing";
  blessing.textContent = item.name;

  const effect = document.createElement("div");
  effect.className = "effect";
  effect.textContent = item.effect;

  card.append(gift, blessing, effect);
  grid.appendChild(card);
});
</script>

</body>
</html>
