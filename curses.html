
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joose Viking Chaos | Curses of Loki</title>

<style>
  :root {
    --gold: #efbc73;
    --cream: #fff1dc;
    --red: #f08a7c;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    display: flex;
    align-items: flex-end;
  }

  .banner {
    width: 100%;
    padding: 10px 14px 12px;
    background: linear-gradient(
      135deg,
      rgba(20, 12, 23, 0.96),
      rgba(56, 15, 29, 0.96)
    );
    border-top: 3px solid var(--gold);
    border-bottom: 3px solid #9b473b;
    box-shadow: 0 0 24px rgba(200, 55, 44, 0.4);
  }

  .heading {
    text-align: center;
    color: var(--gold);
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(239, 188, 115, .3);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
  }

  .item {
    min-width: 0;
    padding: 10px 6px;
    text-align: center;
    background: rgba(10, 8, 15, 0.55);
    border: 1px solid rgba(239, 188, 115, 0.45);
    border-radius: 7px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .gift {
    color: var(--gold);
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
  }

  .curse {
    color: var(--red);
    font-size: 15px;
    font-weight: bold;
    overflow-wrap: anywhere;
  }

  .effect {
    color: var(--cream);
    font-size: 13px;
    line-height: 1.25;
  }

  @media (max-width: 850px) {
    .banner {
      padding: 8px;
    }

    .heading {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .grid {
      gap: 5px;
    }

    .item {
      padding: 8px 3px;
    }

    .gift {
      font-size: 13px;
    }

    .curse {
      font-size: 12px;
    }

    .effect {
      font-size: 11px;
    }
  }

  @media (max-width: 450px) {
    .heading {
      font-size: 15px;
      letter-spacing: 1px;
    }

    .gift {
      font-size: 11px;
    }

    .curse {
      font-size: 10px;
    }

    .effect {
      font-size: 9px;
    }
  }
</style>
</head>

<body>

<div class="banner">

  <div class="heading">
    ⚔️ CURSES OF LOKI ⚔️
  </div>

  <div class="grid" id="curseGrid"></div>

</div>

<script>
const curses = [
  {
    gift: "Perfume",
    name: "Loki's Mischief",
    effect: "-10 Stamina"
  },
  {
    gift: "Love Glasses",
    name: "Loki's Downpour",
    effect: "Wet 30s"
  },
  {
    gift: "Breeze Queen",
    name: "Loki's Sticky Fingers",
    effect: "Tared 15s"
  },
  {
    gift: "Mystic Ney",
    name: "Loki's Venom",
    effect: "Poison 5s"
  },
  {
    gift: "Hanging Lights",
    name: "Surtr's Wrath",
    effect: "Burning 5s"
  },
  {
    gift: "Peek-a-bro",
    name: "Loki's Heavy Burden",
    effect: "Encumbered 15s"
  },
  {
    gift: "Panther Paws",
    name: "Loki's Blood Curse",
    effect: "Bleeding 5s"
  },
  {
    gift: "Prince",
    name: "Hel's Frozen Grip",
    effect: "Frozen 10s"
  },
  {
    gift: "Galaxy",
    name: "Loki's Paralysis",
    effect: "Immobilized 5s"
  },
  {
    gift: "Whale Diving",
    name: "Loki's Puke",
    effect: "Removes Food Buffs"
  }
];

const grid = document.getElementById("curseGrid");

curses.forEach(item => {
  const card = document.createElement("div");
  card.className = "item";

  const gift = document.createElement("div");
  gift.className = "gift";
  gift.textContent = "🎁 " + item.gift;

  const curse = document.createElement("div");
  curse.className = "curse";
  curse.textContent = item.name;

  const effect = document.createElement("div");
  effect.className = "effect";
  effect.textContent = item.effect;

  card.append(gift, curse, effect);
  grid.appendChild(card);
});
</script>

</body>
</html>
